<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>鱈魚大叔消消樂</title>
<style>
  :root {
    --sea-top: #bfe9ff;
    --sea-bottom: #7cc6f0;
    --ink: #3b4a6b;
    --panel: rgba(255, 255, 255, 0.8);
    --board: rgba(255, 255, 255, 0.45);
    --cell: rgba(255, 255, 255, 0.55);
    --accent: #ff8fb8;
    --gold: #ffcc4d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, var(--sea-top), var(--sea-bottom));
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .hidden { display: none !important; }

  /* 背景泡泡 */
  .bg-bubble {
    position: fixed; bottom: -40px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fff, rgba(255,255,255,0.25) 60%, rgba(255,255,255,0.1));
    animation: rise linear infinite; pointer-events: none; opacity: .7; z-index: 0;
  }
  @keyframes rise { to { transform: translateY(-110vh) translateX(20px); } }

  .btn {
    flex: 1; border: 0; border-radius: 16px; padding: 10px 8px; font: inherit; font-weight: 800; font-size: 15px;
    background: #fff; color: var(--ink); cursor: pointer; box-shadow: 0 4px 0 #cfe3f2;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #cfe3f2; }
  .btn.primary { background: var(--accent); color: #fff; box-shadow: 0 4px 0 #e0709a; }
  .btn:disabled { opacity: .5; cursor: default; }

  /* 小魚生命 */
  .lives { display: flex; gap: 2px; align-items: center; }
  .lives svg { width: 30px; height: 22px; }
  .lives svg.empty { filter: grayscale(1); opacity: .35; }

  /* ===== 地圖畫面 ===== */
  #mapScreen { position: relative; height: 100%; display: flex; flex-direction: column; z-index: 1; }
  .map-top {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 16px; background: rgba(255,255,255,.75); box-shadow: 0 3px 0 rgba(90,167,214,.3);
    position: relative; z-index: 2;
  }
  .map-top .title { font-size: 20px; font-weight: 900; color: #fff; text-shadow: 0 2px 0 #5aa7d6; margin: 0; white-space: nowrap; }
  .life-box { display: flex; flex-direction: column; align-items: flex-end; }
  .life-timer { font-size: 11px; font-weight: 800; opacity: .75; min-height: 14px; }
  .map-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
  .map-path { position: relative; width: min(480px, 100%); margin: 0 auto; }
  .map-path svg.road { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .node {
    position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%;
    border: 0; padding: 0; font: inherit; font-size: 24px; font-weight: 900; color: #fff; cursor: pointer;
    background: radial-gradient(circle at 35% 30%, #ffb3cf, #ff6f9f); box-shadow: 0 5px 0 #d4507e, 0 0 0 4px #fff;
  }
  .node.done { background: radial-gradient(circle at 35% 30%, #9fe0ff, #3fa6e6); box-shadow: 0 5px 0 #2d7fb5, 0 0 0 4px #fff; }
  .node.locked { background: #c9d6e2; box-shadow: 0 5px 0 #9fb0c0, 0 0 0 4px #eef3f7; color: #eef3f7; cursor: default; }
  .node.current { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.1); } }
  .node .nstars { position: absolute; left: 50%; top: 62px; transform: translateX(-50%); font-size: 13px; letter-spacing: 1px; white-space: nowrap; }
  .node .nstars .off { filter: grayscale(1); opacity: .35; }
  .marker { position: absolute; width: 58px; margin-left: -29px; pointer-events: none; animation: hop 1.4s ease-in-out infinite; z-index: 2;
    filter: drop-shadow(0 3px 2px rgba(0,0,0,.2)); }
  @keyframes hop { 50% { transform: translateY(-8px); } }
  .map-deco { position: absolute; pointer-events: none; opacity: .9; }

  /* ===== 遊戲畫面：上方一條資訊列，下面是盡量放大的棋盤 ===== */
  .app {
    --size: min(96vw, calc(100vh - 112px), 760px);
    position: relative; height: 100%; z-index: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    padding: 8px;
  }
  @supports (height: 100dvh) { .app { --size: min(96vw, calc(100dvh - 112px), 760px); } }
  .hud {
    position: relative; width: var(--size); display: flex; align-items: center; gap: 10px;
    background: var(--panel); border-radius: 20px; padding: 6px 10px; box-shadow: 0 5px 0 rgba(90,167,214,.35);
  }
  /* 鱈魚大叔頭像：依遊戲狀況換表情 */
  .avatar { position: relative; flex: none; width: 60px; height: 60px; border-radius: 50%; overflow: hidden;
    background: #fff; box-shadow: 0 0 0 3px #fff, 0 2px 6px rgba(0,0,0,.18); }
  .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 6%; display: none; }
  .avatar[data-mood="normal"] img[data-m="normal"], .avatar[data-mood="happy"] img[data-m="happy"],
  .avatar[data-mood="wow"] img[data-m="happy"], .avatar[data-mood="sad"] img[data-m="sad"],
  .avatar[data-mood="angry"] img[data-m="angry"] { display: block; }
  .avatar.bounce { animation: bounce .6s ease; }
  .avatar.shake { animation: shake .5s ease; }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 30% { transform: translateY(-8px) rotate(-6deg); } 60% { transform: translateY(0) rotate(4deg); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  /* 對話泡泡：說話時才出現，浮在棋盤上方，不佔版面 */
  .speech { position: absolute; left: 8px; top: calc(100% + 10px); z-index: 10; max-width: min(78%, 360px);
    background: #fff; border-radius: 14px; padding: 7px 12px; font-weight: 800; font-size: 14px;
    box-shadow: 0 4px 12px rgba(40,80,120,.25); opacity: 0; transform: translateY(-6px); transition: .2s; pointer-events: none; }
  .speech.show { opacity: 1; transform: none; }
  .speech::before { content: ""; position: absolute; left: 26px; top: -12px; border: 7px solid transparent; border-bottom: 7px solid #fff; }
  .hud-info { flex: 1; min-width: 0; }
  .hud-title { font-size: 13px; font-weight: 900; opacity: .75; }
  .hud-nums { display: flex; gap: 14px; align-items: baseline; }
  .hud-nums b { font-size: 22px; font-weight: 900; }
  .hud-nums small { font-size: 12px; font-weight: 800; opacity: .7; margin-left: 2px; }
  .hud-nums .moves b { color: #ff6f9f; }
  .goals { display: flex; justify-content: center; gap: 6px; }
  .goal { position: relative; width: 46px; text-align: center; font-weight: 900; font-size: 14px; }
  .goal img { width: 38px; height: 38px; object-fit: contain; display: block; margin: 0 auto; }
  .goal.done span { color: #27a35a; }
  .goal img.gbg { background: #ffe9d6; border-radius: 10px; box-shadow: inset 0 0 0 2px #f5c9a6; }
  .goal .gicon { display: block; height: 38px; font-size: 28px; line-height: 38px; }
  .dlg-goals .goal .gicon { height: 48px; font-size: 36px; line-height: 48px; }
  .goal.bump img { animation: bump .3s ease; }
  @keyframes bump { 50% { transform: scale(1.3); } }
  .progress { height: 12px; background: #e6f2fb; border-radius: 99px; position: relative; margin: 3px 8px 2px 0; }
  .progress .fill { height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, #ffd84d, #ff9ec7); transition: width .4s ease; }
  .progress .pstar { position: absolute; top: 50%; transform: translate(-50%, -50%); font-size: 14px; filter: grayscale(1); opacity: .45; transition: .3s; }
  .progress .pstar.on { filter: none; opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
  .hud-btns { display: flex; gap: 6px; flex: none; }
  .hud-break { display: none; }
  /* 道具 */
  .boosters { display: flex; gap: 5px; flex: none; }
  .booster { position: relative; width: 44px; height: 44px; border: 0; border-radius: 12px; background: #fff; padding: 4px;
    box-shadow: 0 3px 0 #cfe3f2; cursor: pointer; }
  .booster img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .booster .count { position: absolute; right: -5px; bottom: -5px; min-width: 18px; height: 18px; border-radius: 9px; padding: 0 4px;
    background: #ff6f9f; color: #fff; font-size: 11px; font-weight: 900; line-height: 18px; box-shadow: 0 0 0 2px #fff; }
  .booster.active { background: #ffe1ec; box-shadow: 0 0 0 3px #ff8fb8; animation: wiggle .6s ease-in-out infinite; }
  .booster:disabled { opacity: .4; cursor: default; }
  .board.aiming { cursor: crosshair; }
  .booster-gift { display: inline-flex; align-items: center; gap: 6px; background: #fff4d6; border-radius: 12px; padding: 4px 10px; font-weight: 800; }
  .booster-gift img { width: 30px; height: 30px; }
  .icon-btn { width: 38px; height: 38px; border: 0; border-radius: 12px; background: #fff; font-size: 18px; cursor: pointer;
    box-shadow: 0 3px 0 #cfe3f2; padding: 0; }
  .icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #cfe3f2; }

  /* 棋盤 */
  .board-wrap { width: var(--size); height: var(--size); padding: 6px; flex: none; }
  .board { position: relative; width: 100%; height: 100%; touch-action: none; }
  /* 棋盤形狀：只畫有格子的地方，外面加白邊和陰影 */
  .shape { position: absolute; inset: 0; filter: drop-shadow(0 0 0 #fff) drop-shadow(0 0 3px #fff) drop-shadow(0 6px 0 rgba(90,167,214,.4)); }
  .cell-back { position: absolute; width: 12.5%; height: 12.5%; }
  .cell-back::before { content: ""; position: absolute; inset: -5px; background: #d6ecf9; border-radius: 12px; }
  .cell-bg { position: absolute; width: 12.5%; height: 12.5%; padding: 3px; }
  .cell-bg::before { content: ""; display: block; width: 100%; height: 100%; border-radius: 14px; background: var(--cell); }
  .tile { position: absolute; left: 0; top: 0; width: 12.5%; height: 12.5%; transition: transform .18s ease; cursor: pointer; z-index: 1; }
  .tile.fall { transition: transform .32s cubic-bezier(.45,.05,.55,1.35); }
  .tile .inner { position: absolute; inset: 7%; transition: transform .15s ease; }
  .tile .plate { position: absolute; inset: -2%; width: 104%; height: 104%; overflow: visible; }
  .tile .plate use { stroke: #fff; stroke-width: 5; paint-order: stroke; }
  .tile img.char { position: absolute; left: 12%; top: 9%; width: 76%; height: 80%; object-fit: contain; pointer-events: none;
    filter: drop-shadow(0 2px 1px rgba(0,0,0,.18)); }
  .tile img.char.big { left: 3%; top: 4%; width: 94%; height: 90%; }
  .tile.selected .inner { transform: scale(1.15); animation: wiggle .5s ease-in-out infinite; }
  .tile.hint .inner { animation: wiggle .6s ease-in-out infinite; }
  @keyframes wiggle { 0%,100% { rotate: -6deg; } 50% { rotate: 6deg; } }
  .tile.pop .inner { animation: pop .26s ease forwards; }
  @keyframes pop { 40% { transform: scale(1.3); } 100% { transform: scale(0); opacity: 0; } }
  .tile.born .inner { animation: born .35s ease; }
  @keyframes born { 0% { transform: scale(.2) rotate(-90deg); } 70% { transform: scale(1.25); } }

  /* 美乃滋（黏住角色）與調味料（撒在格子上） */
  .mayo, .season { position: absolute; left: 0; top: 0; width: 12.5%; height: 12.5%; pointer-events: none; }
  /* 美乃滋網蓋在角色上面把它黏住（從網子空隙看得到角色）；調味料撒在格子上 */
  .mayo { z-index: 2; padding: 2px; }
  .mayo img { opacity: .92; filter: drop-shadow(0 1px 1px rgba(150,110,40,.45)); }
  .season { z-index: 2; padding: 2px; }
  .mayo::before { content: ""; position: absolute; inset: 3px; border-radius: 12px;
    background: rgba(255,240,190,.35); box-shadow: inset 0 0 0 2px rgba(214,170,80,.7); }
  .mayo img, .season img { position: relative; width: 100%; height: 100%; display: block; }
  .season img { filter: saturate(1.4) contrast(1.15) drop-shadow(0 0 1px rgba(255,255,255,.9)); }
  .season::before { content: ""; position: absolute; inset: 3px; border-radius: 12px;
    background: radial-gradient(circle, rgba(255,120,60,.10), rgba(255,100,40,.22)); }
  .mayo.hit img, .season.hit img { animation: crack .25s ease; }
  .mayo.gone img, .season.gone img { animation: shatter .3s ease forwards; }

  /* 冰塊（固定不動，方塊會從後面穿過） */
  .ice { position: absolute; left: 0; top: 0; width: 12.5%; height: 12.5%; padding: 2px; z-index: 3; pointer-events: none; }
  .ice img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 2px 2px rgba(30,90,140,.25)); }
  .ice.hit img { animation: crack .25s ease; }
  @keyframes crack { 30% { transform: scale(.88) rotate(-4deg); } 60% { transform: scale(1.05) rotate(3deg); } }
  .ice.gone img { animation: shatter .3s ease forwards; }
  @keyframes shatter { to { transform: scale(1.4); opacity: 0; } }

  .cheer { position: absolute; width: 34%; left: 33%; top: 40%; pointer-events: none; z-index: 6;
    animation: cheer 1s ease forwards; filter: drop-shadow(0 6px 8px rgba(0,0,0,.2)); }
  .cheer.small { width: 16%; left: 42%; top: 32%; }
  @keyframes cheer { 0% { transform: translateY(40%) scale(.3); opacity: 0; } 30% { transform: translateY(0) scale(1.05); opacity: 1; } 75% { opacity: 1; } 100% { transform: translateY(-20%) scale(1); opacity: 0; } }

  /* 特殊方塊 */
  .fx { position: absolute; inset: -4%; pointer-events: none; border-radius: 30%; z-index: 2; }
  .fx.row { background: repeating-linear-gradient(0deg, transparent 0 20%, rgba(255,255,255,.75) 20% 27%); }
  .fx.col { background: repeating-linear-gradient(90deg, transparent 0 20%, rgba(255,255,255,.75) 20% 27%); }
  .fx.row::after, .fx.col::after {
    content: "◀▶"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font-size: 11px; letter-spacing: 16px; padding-left: 16px; color: #ff5e8e; text-shadow: 0 0 3px #fff, 0 0 3px #fff; }
  .fx.col::after { content: "▲▼"; writing-mode: vertical-rl; letter-spacing: 16px; padding: 16px 0 0; }
  .fx.area { box-shadow: 0 0 0 3px #fff, 0 0 14px 5px #ffe066; animation: glow 1s ease-in-out infinite; }
  .fx.bomb { inset: -2%; border-radius: 50%; z-index: 0;
    background: conic-gradient(#ff9ec7, #ffd84d, #8fe0a0, #7ec8ff, #c7a0ff, #ff9ec7);
    box-shadow: 0 0 12px 4px rgba(255,236,150,.9); animation: spin 3s linear infinite; }
  .fx.bomb::before { content: ""; position: absolute; inset: 12%; border-radius: 50%; background: #fffbea; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes glow { 50% { opacity: .5; } }

  .particle { position: absolute; width: 12px; height: 12px; border-radius: 50%; pointer-events: none; animation: burst .6s ease-out forwards; z-index: 4; }
  @keyframes burst { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
  .beam { position: absolute; pointer-events: none; background: linear-gradient(90deg, transparent, #fff, transparent); animation: beam .35s ease-out forwards; border-radius: 99px; z-index: 4; }
  .beam.v { background: linear-gradient(180deg, transparent, #fff, transparent); }
  @keyframes beam { from { opacity: 1; } to { opacity: 0; } }
  .floater { position: absolute; font-weight: 900; font-size: 22px; color: #fff; pointer-events: none;
    text-shadow: 0 2px 0 #ff6f9f, 0 0 8px rgba(255,111,159,.6);
    animation: floatup .9s ease-out forwards; transform: translate(-50%, -50%); white-space: nowrap; z-index: 5; }
  @keyframes floatup { to { transform: translate(-50%, -140%); opacity: 0; } }
  .combo-banner { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%);
    font-size: clamp(28px, 7vw, 52px); font-weight: 900; color: #fff; pointer-events: none; z-index: 6;
    text-shadow: 0 4px 0 #ff8fb8, 0 8px 16px rgba(0,0,0,.2); animation: banner .9s ease forwards; white-space: nowrap; }
  @keyframes banner { 0% { transform: translate(-50%,-50%) scale(.3); opacity: 0; } 25% { transform: translate(-50%,-50%) scale(1.15); opacity: 1; } 75% { opacity: 1; } 100% { transform: translate(-50%,-80%) scale(1); opacity: 0; } }

  /* 彈窗 */
  .overlay { position: fixed; inset: 0; background: rgba(40, 80, 120, .45); display: none;
    align-items: center; justify-content: center; z-index: 20; padding: 16px; }
  .overlay.show { display: flex; }
  .dialog { background: #fff; border-radius: 28px; padding: 22px 22px 18px; width: min(380px, 100%); text-align: center;
    box-shadow: 0 10px 0 #cfe3f2; animation: dlg .4s ease; max-height: 100%; overflow-y: auto; }
  @keyframes dlg { from { transform: scale(.7); opacity: 0; } }
  .dialog h2 { margin: 4px 0 6px; font-size: 26px; }
  .dialog p { margin: 6px 0 12px; line-height: 1.6; }
  .dialog .mini { height: 140px; margin: 0 auto; display: block; }
  .dialog .row { display: flex; gap: 10px; }
  .dlg-goals { display: flex; justify-content: center; gap: 14px; margin: 10px 0; background: #f3f9fe; border-radius: 16px; padding: 10px; }
  .dlg-goals .goal { width: 64px; }
  .dlg-goals .goal img { width: 48px; height: 48px; }
  .cast { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 4px 0 2px; }
  .cast figure { margin: 0; font-size: 12px; font-weight: 800; }
  .cast img { width: 100%; height: 58px; object-fit: contain; display: block; }
  .howto img { height: 22px; vertical-align: middle; }
  .stars { font-size: 38px; letter-spacing: 6px; margin: 4px 0; }
  .stars .off { filter: grayscale(1); opacity: .3; }
  .howto { text-align: left; font-size: 14px; background: #f3f9fe; border-radius: 16px; padding: 10px 14px; margin: 10px 0 14px; }
  .howto div { margin: 4px 0; }

  /* 窄螢幕（手機直向）：資訊列分兩行，目標放第二行 */
  @media (max-width: 560px) {
    .app { justify-content: flex-start; padding-top: 10px; --size: min(96vw, calc(100vh - 170px)); }
    .hud { flex-wrap: wrap; row-gap: 4px; padding: 6px 8px; }
    .avatar { width: 52px; height: 52px; }
    .hud-break { display: block; order: 4; flex-basis: 100%; height: 0; border-top: 1px dashed #d5e6f2; }
    .goals { order: 5; flex: 1; justify-content: flex-start; }
    .boosters { order: 6; }
    .booster { width: 40px; height: 40px; }
    .icon-btn { width: 34px; height: 34px; font-size: 16px; }
    .cell-bg { padding: 2px; }
    .cell-bg::before { border-radius: 10px; }
  }
</style>
</head>
<body>

<!-- 共用圖形 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- 每種消除方塊底下的小盤子：顏色＋形狀都不同，比較好分辨 -->
    <symbol id="p0" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44"/></symbol>
    <symbol id="p1" viewBox="0 0 100 100"><rect x="8" y="8" width="84" height="84" rx="22"/></symbol>
    <symbol id="p2" viewBox="0 0 100 100"><path d="M50 4 L90 27 L90 73 L50 96 L10 73 L10 27 Z" stroke-linejoin="round" stroke-width="8"/></symbol>
    <symbol id="p3" viewBox="0 0 100 100"><path d="M50 6 C60 6 64 16 72 18 C80 20 90 18 92 30 C94 40 86 44 88 52 C90 60 96 66 90 76 C84 86 74 80 66 86 C58 92 56 96 50 96 C44 96 42 92 34 86 C26 80 16 86 10 76 C4 66 10 60 12 52 C14 44 6 40 8 30 C10 18 20 20 28 18 C36 16 40 6 50 6 Z"/></symbol>
    <symbol id="p4" viewBox="0 0 100 100"><rect x="13" y="13" width="74" height="74" rx="14" transform="rotate(45 50 50)"/></symbol>
    <symbol id="p5" viewBox="0 0 100 100"><rect x="4" y="16" width="92" height="68" rx="34"/></symbol>
    <!-- 小魚生命圖示（暫代圖，之後可換成正式素材） -->
    <symbol id="fish" viewBox="0 0 60 40">
      <path d="M44 20 L58 8 L56 20 L58 32 Z" fill="#ff8fb8" stroke="#e0709a" stroke-width="2" stroke-linejoin="round"/>
      <ellipse cx="26" cy="20" rx="22" ry="15" fill="#ff9ec7" stroke="#e0709a" stroke-width="2"/>
      <path d="M22 6 Q30 0 36 7" fill="#ff8fb8" stroke="#e0709a" stroke-width="2"/>
      <circle cx="15" cy="17" r="3.5" fill="#3b3048"/><circle cx="16" cy="16" r="1.2" fill="#fff"/>
      <path d="M8 24 Q11 27 14 24" fill="none" stroke="#3b3048" stroke-width="1.8" stroke-linecap="round"/>
      <ellipse cx="22" cy="25" rx="4" ry="2.2" fill="#ff6f9f" opacity=".5"/>
    </symbol>
  </defs>
</svg>

<!-- ===== 關卡地圖 ===== -->
<section id="mapScreen">
  <header class="map-top">
    <h1 class="title">鱈魚大叔消消樂</h1>
    <div class="life-box"><div class="lives" id="mapLives"></div><div class="life-timer" id="lifeTimer"></div></div>
  </header>
  <div class="map-scroll" id="mapScroll"><div class="map-path" id="mapPath"></div></div>
</section>

<!-- ===== 遊戲 ===== -->
<section class="app hidden" id="gameScreen">
  <header class="hud">
    <div class="avatar" id="mascot" data-mood="normal">
      <img data-m="normal" src="assets/chef-happy.webp" alt="鱈魚大叔">
      <img data-m="happy" src="assets/chef-laugh.webp" alt="">
      <img data-m="sad" src="assets/chef-cry.webp" alt="">
      <img data-m="angry" src="assets/chef-angry.webp" alt="">
    </div>
    <div class="speech" id="speech"></div>
    <div class="hud-info">
      <div class="hud-title" id="levelTitle">第 1 關</div>
      <div class="hud-nums"><span class="moves"><b id="moves">0</b><small>步</small></span><span><b id="score">0</b><small>分</small></span></div>
      <div class="progress" id="progress"><div class="fill" id="bar"></div></div>
    </div>

    <div class="boosters" id="boosters"></div>
    <div class="hud-btns">
      <button class="icon-btn" id="btnMap" title="回地圖">🗺️</button>
      <button class="icon-btn" id="btnSound" title="音效">🔊</button>
      <button class="icon-btn" id="btnHelp" title="玩法">❔</button>
    </div>
  </header>
  <main class="board-wrap"><div class="board" id="board"></div></main>
</section>

<div class="overlay" id="overlay"><div class="dialog" id="dialog"></div></div>

<script>
(() => {
  const N = 8, TYPES = 6;

  /* ---------- 角色 ---------- */
  // 六種消除方塊：每一種都是不同角色的正面，底下墊不同顏色與形狀的盤子
  const TILES = [
    { img: 'assets/tile-cod.webp',     color: '#ffe27a', name: '無臉鱈花枝' },
    { img: 'assets/tile-shrimp.webp',  color: '#ffb3cf', name: '鱈蝦球' },
    { img: 'assets/tile-horn.webp',    color: '#9fd4ff', name: '鱈花枝' },
    { img: 'assets/tile-popcorn.webp', color: '#d5c2ff', name: '沙拉鱈花枝' },
    { img: 'assets/tile-chef.webp',    color: '#bdea8a', name: '鱈魚大叔' },
    { img: 'assets/tile-root.webp',    color: '#7fdcd0', name: '牛蒡精靈', big: true },
  ];
  const COLORS = TILES.map(t => t.color);
  // 鱈魚大叔的四種表情
  const CHEF = { happy: 'assets/chef-happy.webp', angry: 'assets/chef-angry.webp', cry: 'assets/chef-cry.webp', laugh: 'assets/chef-laugh.webp' };
  const ICE_IMG = ['', 'assets/ice-1.webp', 'assets/ice-2.webp', 'assets/ice-3.webp'];
  // 連成 5 個時的特殊方塊：閃亮鱈花枝
  const SPECIAL_IMG = 'assets/tile-sparkle.webp', SPECIAL_NAME = '閃亮鱈花枝';
  // 道具：都不算步數
  const BOOSTERS = {
    hammer: { img: 'assets/booster-hammer.webp', name: '槌子', tip: '點一格直接敲掉（冰塊敲一層）' },
    tongs:  { img: 'assets/booster-tongs.webp',  name: '夾子', tip: '夾兩個相鄰的角色交換，不用湊成一排' },
    fryer:  { img: 'assets/booster-fryer.webp',  name: '炸鍋', tip: '整盤翻一翻重新洗牌' },
  };
  const MAYO_IMG = ['', 'assets/mayo-1.webp', 'assets/mayo-2.webp'];
  const SEASON_IMG = ['', 'assets/season-1.webp', 'assets/season-2.webp'];
  [...TILES.map(t => t.img), ...Object.values(CHEF), ...ICE_IMG.slice(1), ...MAYO_IMG.slice(1), ...SEASON_IMG.slice(1), SPECIAL_IMG, 'assets/horn-laugh.webp', ...Object.values(BOOSTERS).map(b => b.img)]
    .forEach(src => { new Image().src = src; });

  /* ---------- 關卡 ----------
     layout：8 行 × 8 格
       「.」一般格子　「x」沒有格子（棋盤形狀）
       「1~3」冰塊（要敲幾下）
       「m / M」美乃滋 1 / 2 層（黏住角色，不能移動也不會掉落；消除它就清掉一層）
       「s / S」調味料 1 / 2 層（撒在格子上，角色能移動；在那一格消除才會變少）
     goals：score 分數 / collect 收集角色（tile 是 TILES 的編號）/ ice 冰塊 / mayo 美乃滋 / season 調味料 */
  const LEVELS = [
    { moves: 20, stars: [1500, 3000, 4500], goals: [{ type: 'score', n: 1500 }], layout: [
      'xx....xx', 'x......x', '........', '........', '........', '........', 'x......x', 'xx....xx'] },
    { moves: 22, stars: [1500, 3000, 4500], goals: [{ type: 'collect', tile: 0, n: 15 }, { type: 'collect', tile: 1, n: 15 }], layout: [
      'x..xx..x', '........', '........', '........', 'x......x', 'xx....xx', 'xxx..xxx', 'xxx..xxx'] },
    { moves: 20, stars: [1200, 2500, 4000], goals: [{ type: 'ice' }], layout: [
      'xxx..xxx', 'xx....xx', 'x..11..x', '..1111..', '..1111..', 'x..11..x', 'xx....xx', 'xxx..xxx'] },
    { moves: 22, stars: [1500, 3000, 4500], goals: [{ type: 'season' }], layout: [
      'xx....xx', 'xx.ss.xx', '..ssss..', '.ssssss.', '.ssssss.', '..ssss..', 'xx.ss.xx', 'xx....xx'] },
    { moves: 22, stars: [1500, 3000, 4500], goals: [{ type: 'mayo' }], layout: [
      '........', '.m....m.', '........', '...mm...', '...mm...', '........', '.m....m.', '........'] },
    { moves: 24, stars: [2000, 3500, 5000], goals: [{ type: 'ice' }], layout: [
      '..xxxx..', '........', '.222222.', '.2....2.', '.2....2.', '.222222.', '........', '..xxxx..'] },
    { moves: 25, stars: [2500, 4000, 5500], goals: [{ type: 'season' }, { type: 'collect', tile: 5, n: 15 }], layout: [
      'SSSSSSSS', '........', 'x.SSSS.x', 'x......x', 'x......x', 'x.SSSS.x', '........', 'ssssssss'] },
    { moves: 24, stars: [2500, 4000, 5500], goals: [{ type: 'mayo' }, { type: 'collect', tile: 4, n: 18 }], layout: [
      'xx....xx', 'x.M..M.x', '..M..M..', '........', '........', '..m..m..', 'x.m..m.x', 'xx....xx'] },
    { moves: 22, stars: [4000, 5500, 7000], goals: [{ type: 'score', n: 4000 }], layout: [
      '........', '........', 'x......x', 'xx....xx', 'xx....xx', 'x......x', '........', '........'] },
    { moves: 28, stars: [3000, 5000, 7000], goals: [{ type: 'ice' }, { type: 'season' }], layout: [
      '33....33', '3......3', '..ssss..', '..sSSs..', '..sSSs..', '..ssss..', '3......3', '33....33'] },
    { moves: 26, stars: [2500, 4000, 6000], goals: [{ type: 'ice' }, { type: 'mayo' }], layout: [
      '...xx...', '...xx...', '.M.xx.M.', '...xx...', '...xx...', '.1.xx.1.', '...xx...', '...xx...'] },
    { moves: 28, stars: [3000, 5000, 7000], goals: [{ type: 'ice' }], layout: [
      '1.1.1.1.', '.2.2.2.2', '1.1.1.1.', 'xx....xx', 'xx....xx', '1.1.1.1.', '.2.2.2.2', '1.1.1.1.'] },
    { moves: 28, stars: [3500, 5500, 7500], goals: [{ type: 'ice' }, { type: 'season' }], layout: [
      '33333333', '22222222', 'SSSSSSSS', 'ssssssss', '........', '........', '........', '........'] },
    { moves: 30, stars: [3000, 5000, 7000], goals: [{ type: 'mayo' }], layout: [
      'xx....xx', 'xx.MM.xx', '...mm...', '.MmMMmM.', '.MmMMmM.', '...mm...', 'xx.MM.xx', 'xx....xx'] },
    { moves: 35, stars: [4000, 6500, 9000], goals: [{ type: 'ice' }, { type: 'season' }, { type: 'mayo' }], layout: [
      '2..33..2', '.SM..MS.', '..ssss..', '3.sSSs.3', '3.sSSs.3', '..ssss..', '.SM..MS.', '2..33..2'] },
  ];

  /* ---------- 存檔與小魚生命 ---------- */
  const MAX_LIVES = 5, REGEN_MS = 20 * 60 * 1000, SAVE_KEY = 'codUncleMatch.v1';
  let save = { stars: [], lives: MAX_LIVES, lifeAt: Date.now(), boosters: { hammer: 3, tongs: 3, fryer: 3 } };
  try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch (e) {}
  save.boosters = Object.assign({ hammer: 3, tongs: 3, fryer: 3 }, save.boosters);
  function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
  function syncLives() {
    if (save.lives >= MAX_LIVES) { save.lives = MAX_LIVES; save.lifeAt = Date.now(); return; }
    const n = Math.floor((Date.now() - save.lifeAt) / REGEN_MS);
    if (n > 0) {
      save.lives = Math.min(MAX_LIVES, save.lives + n);
      save.lifeAt = save.lives >= MAX_LIVES ? Date.now() : save.lifeAt + n * REGEN_MS;
      persist();
    }
  }
  function loseLife() { syncLives(); if (save.lives >= MAX_LIVES) save.lifeAt = Date.now(); save.lives = Math.max(0, save.lives - 1); persist(); }
  function livesHTML() {
    return Array.from({ length: MAX_LIVES }, (_, i) =>
      `<svg viewBox="0 0 60 40" class="${i < save.lives ? '' : 'empty'}"><use href="#fish"/></svg>`).join('');
  }
  function lifeTimerText() {
    if (save.lives >= MAX_LIVES) return '小魚滿滿！';
    const left = REGEN_MS - (Date.now() - save.lifeAt), m = Math.floor(left / 60000), s = Math.floor(left / 1000) % 60;
    return `下一隻小魚 ${m}:${String(s).padStart(2, '0')}`;
  }

  /* ---------- 遊戲狀態 ---------- */
  const boardEl = document.getElementById('board');
  const mascotEl = document.getElementById('mascot');
  const speechEl = document.getElementById('speech');
  let grid = [];           // grid[r][c] = { type, special, el } | null（冰塊格是 null）
  let ice = [];            // ice[r][c] = { hp, el } | null
  let mayo = [], season = []; // 同上，美乃滋在角色底下、調味料在角色上面
  let voids = [];          // voids[r][c] = true 代表這格不在棋盤上
  let busy = false, score = 0, moves = 0, levelIdx = 0, L = LEVELS[0], movesUsed = 0;
  let collected = [];
  let selected = null, hintTimer = null, hinted = [];
  let soundOn = true, audioCtx = null;

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const rand = n => Math.floor(Math.random() * n);
  const key = (r, c) => r * N + c;
  const inside = (r, c) => r >= 0 && r < N && c >= 0 && c < N;
  const tileImg = i => TILES[i].img;

  /* ---------- 音效 ---------- */
  function tone(freq, dur = .12, type = 'sine', vol = .15) {
    if (!soundOn) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, audioCtx.currentTime);
      o.frequency.exponentialRampToValueAtTime(freq * 1.6, audioCtx.currentTime + dur);
      g.gain.setValueAtTime(vol, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + dur);
      o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }
  const sfx = {
    swap: () => tone(520, .08, 'triangle', .1),
    bad: () => { tone(260, .12, 'square', .06); setTimeout(() => tone(200, .15, 'square', .06), 100); },
    pop: combo => tone(440 * Math.pow(1.12, Math.min(combo, 10)), .14, 'sine', .16),
    special: () => { tone(660, .2, 'triangle', .14); setTimeout(() => tone(990, .25, 'triangle', .12), 90); },
    ice: () => tone(1500, .08, 'square', .05),
    win: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, .25, 'triangle', .14), i * 130)),
    lose: () => [392, 330, 262].forEach((f, i) => setTimeout(() => tone(f, .3, 'sine', .12), i * 180)),
  };

  /* ---------- 吉祥物 ---------- */
  let moodTimer = null, speechTimer = null;
  function say(text, mood = 'normal', anim = 'bounce', hold = 1800) {
    speechEl.textContent = text;
    speechEl.classList.add('show');
    clearTimeout(speechTimer);
    speechTimer = setTimeout(() => speechEl.classList.remove('show'), Math.max(hold, 2200));
    mascotEl.dataset.mood = mood;
    mascotEl.classList.remove('bounce', 'shake'); void mascotEl.offsetWidth;
    if (anim) mascotEl.classList.add(anim);
    clearTimeout(moodTimer);
    if (hold) moodTimer = setTimeout(() => { mascotEl.dataset.mood = 'normal'; }, hold);
  }
  const COMBO_LINES = ['', '', '不錯喔～', '鮮到不行！', '大叔我感動了～', '海底最強！', '無敵鱈魚拳！！'];

  /* ---------- 方塊與冰塊 ---------- */
  function tileHTML(t) {
    if (t.special === 'bomb')
      return `<div class="inner"><div class="fx bomb"></div><img class="char big" src="${SPECIAL_IMG}" alt="" draggable="false"></div>`;
    const d = TILES[t.type];
    const fx = t.special ? `<div class="fx ${t.special}"></div>` : '';
    return `<div class="inner"><svg class="plate" viewBox="0 0 100 100"><use href="#p${t.type}" fill="${d.color}"/></svg>` +
      `<img class="char${d.big ? ' big' : ''}" src="${d.img}" alt="" draggable="false">${fx}</div>`;
  }
  function setPos(el, r, c) { el.style.transform = `translate(${c * 100}%, ${r * 100}%)`; }
  function makeTile(type, special, r, c, startRow = r) {
    const t = { type, special: special || null, el: document.createElement('div') };
    t.el.className = 'tile';
    t.el.innerHTML = tileHTML(t);
    setPos(t.el, startRow, c);
    boardEl.appendChild(t.el);
    return t;
  }
  function refreshTile(t) { t.el.innerHTML = tileHTML(t); }
  // 冰塊、美乃滋、調味料都是「固定在格子上、要打好幾下」的圖層，共用同一套做法
  const LAYERS = {
    ice:    { cls: 'ice',    imgs: ICE_IMG,    color: '#bfe9ff', points: 40, get: () => ice },
    mayo:   { cls: 'mayo',   imgs: MAYO_IMG,   color: '#fff3c4', points: 30, get: () => mayo },
    season: { cls: 'season', imgs: SEASON_IMG, color: '#ff7a4d', points: 30, get: () => season },
  };
  function makeLayer(kind, hp, r, c) {
    const el = document.createElement('div');
    el.className = LAYERS[kind].cls;
    el.innerHTML = `<img src="${LAYERS[kind].imgs[hp]}" alt="" draggable="false">`;
    setPos(el, r, c);
    boardEl.appendChild(el);
    return { hp, el };
  }
  const layerCount = kind => LAYERS[kind].get().flat().filter(Boolean).length;
  function hitLayer(kind, r, c) {
    const L2 = LAYERS[kind], arr = L2.get(), x = arr[r][c];
    if (!x) return;
    x.hp--;
    burst(r, c, L2.color);
    score += L2.points;
    if (x.hp <= 0) {
      x.el.classList.add('gone');
      setTimeout(() => x.el.remove(), 320);
      arr[r][c] = null;
    } else {
      x.el.querySelector('img').src = L2.imgs[x.hp];
      x.el.classList.remove('hit'); void x.el.offsetWidth; x.el.classList.add('hit');
    }
  }
  // 不會掉落的格子：不在棋盤上、冰塊、被調味料黏住的角色
  const isFixed = (r, c) => voids[r][c] || ice[r][c] || mayo[r][c];
  const movable = (r, c) => inside(r, c) && grid[r][c] && !mayo[r][c];
  const allCells = () => { const a = []; for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) a.push([r, c]); return a; };
  const tilesEach = fn => { for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (grid[r][c]) fn(grid[r][c], r, c); };

  /* ---------- 棋盤邏輯 ---------- */
  function findRuns() {
    const runs = [];
    const typeAt = (r, c) => { const t = grid[r][c]; return t && t.special !== 'bomb' ? t.type : -1; };
    for (let r = 0; r < N; r++) {
      let s = 0;
      for (let c = 1; c <= N; c++) {
        if (c < N && typeAt(r, c) === typeAt(r, s) && typeAt(r, s) >= 0) continue;
        if (c - s >= 3 && typeAt(r, s) >= 0) runs.push({ dir: 'h', type: typeAt(r, s), cells: Array.from({ length: c - s }, (_, i) => [r, s + i]) });
        s = c;
      }
    }
    for (let c = 0; c < N; c++) {
      let s = 0;
      for (let r = 1; r <= N; r++) {
        if (r < N && typeAt(r, c) === typeAt(s, c) && typeAt(s, c) >= 0) continue;
        if (r - s >= 3 && typeAt(s, c) >= 0) runs.push({ dir: 'v', type: typeAt(s, c), cells: Array.from({ length: r - s }, (_, i) => [s + i, c]) });
        s = r;
      }
    }
    return runs;
  }

  function swapModel(r1, c1, r2, c2) { const t = grid[r1][c1]; grid[r1][c1] = grid[r2][c2]; grid[r2][c2] = t; }

  function findMove() {
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      if (!movable(r, c)) continue;
      if (grid[r][c].special === 'bomb') {
        const nb = [[r, c + 1], [r + 1, c], [r, c - 1], [r - 1, c]].find(([a, b]) => movable(a, b));
        if (nb) return [[r, c], nb];
      }
      for (const [dr, dc] of [[0, 1], [1, 0]]) {
        const r2 = r + dr, c2 = c + dc;
        if (!movable(r2, c2)) continue;
        swapModel(r, c, r2, c2);
        const ok = findRuns().length > 0;
        swapModel(r, c, r2, c2);
        if (ok) return [[r, c], [r2, c2]];
      }
    }
    return null;
  }

  function randomFill(blocked) {
    // 產生沒有現成三連、但至少有一步可走的盤面（冰塊和沒有格子的地方空著）
    for (;;) {
      grid = Array.from({ length: N }, () => Array(N).fill(null));
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
        if (blocked[r][c]) continue;
        const same = (a, b, t) => a >= 0 && b >= 0 && grid[a][b] && grid[a][b].type === t;
        let t;
        do { t = rand(TYPES); } while ((same(r, c - 1, t) && same(r, c - 2, t)) || (same(r - 1, c, t) && same(r - 2, c, t)));
        grid[r][c] = { type: t, special: null };
      }
      if (findMove()) return grid.map(row => row.map(x => x && x.type));
    }
  }

  function buildBoard() {
    boardEl.innerHTML = '';
    const ch = (r, c) => (L.layout ? L.layout[r][c] : '.') || '.';
    voids = Array.from({ length: N }, (_, r) => Array.from({ length: N }, (_, c) => ch(r, c) === 'x'));
    const shape = document.createElement('div');
    shape.className = 'shape';
    for (const [r, c] of allCells()) {
      if (voids[r][c]) continue;
      for (const cls of ['cell-back', 'cell-bg']) {
        const el = document.createElement('div');
        el.className = cls;
        el.style.transform = `translate(${c * 100}%, ${r * 100}%)`;
        shape.appendChild(el);
      }
    }
    // 先放全部底層，再放格子，讓相鄰格子的底色連成一整塊
    [...shape.querySelectorAll('.cell-bg')].forEach(el => shape.appendChild(el));
    boardEl.appendChild(shape);
    const layerAt = (test, r, c) => { const x = ch(r, c); return test(x); };
    const iceHp = x => x >= '1' && x <= '3' ? +x : 0;
    const mayoHp = x => x === 'm' ? 1 : x === 'M' ? 2 : 0;
    const seasonHp = x => x === 's' ? 1 : x === 'S' ? 2 : 0;
    const blocked = Array.from({ length: N }, (_, r) => Array.from({ length: N }, (_, c) => voids[r][c] || !!iceHp(ch(r, c))));
    const layerGrid = (kind, hpOf) => Array.from({ length: N }, (_, r) => Array.from({ length: N }, (_, c) => {
      const hp = layerAt(hpOf, r, c); return hp ? makeLayer(kind, hp, r, c) : null; }));
    // 圖層要先建好，產生盤面時才知道哪些角色被黏住不能動
    mayo = layerGrid('mayo', mayoHp);
    ice = layerGrid('ice', iceHp);
    season = layerGrid('season', seasonHp);
    const types = randomFill(blocked);
    grid = types.map((row, r) => row.map((type, c) => type === null ? null : makeTile(type, null, r, c, r - N)));
    requestAnimationFrame(() => requestAnimationFrame(() => tilesEach((t, r, c) => { t.el.classList.add('fall'); setPos(t.el, r, c); })));
  }

  /* ---------- 特效 ---------- */
  function cellCenter(r, c) { const s = boardEl.clientWidth / N; return [c * s + s / 2, r * s + s / 2]; }
  function burst(r, c, color) {
    const [x, y] = cellCenter(r, c);
    for (let i = 0; i < 6; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const a = Math.random() * Math.PI * 2, d = 25 + Math.random() * 30;
      p.style.left = x - 6 + 'px'; p.style.top = y - 6 + 'px';
      p.style.background = i % 2 ? '#fff' : color;
      p.style.setProperty('--dx', Math.cos(a) * d + 'px');
      p.style.setProperty('--dy', Math.sin(a) * d + 'px');
      boardEl.appendChild(p);
      setTimeout(() => p.remove(), 650);
    }
  }
  function beam(r, c, vertical) {
    const b = document.createElement('div'); const s = boardEl.clientWidth / N;
    b.className = 'beam' + (vertical ? ' v' : '');
    if (vertical) Object.assign(b.style, { left: c * s + s * .3 + 'px', top: 0, width: s * .4 + 'px', height: '100%' });
    else Object.assign(b.style, { top: r * s + s * .3 + 'px', left: 0, height: s * .4 + 'px', width: '100%' });
    boardEl.appendChild(b); setTimeout(() => b.remove(), 400);
  }
  function floater(r, c, text) {
    const [x, y] = cellCenter(r, c);
    const f = document.createElement('div');
    f.className = 'floater'; f.textContent = text; f.style.left = x + 'px'; f.style.top = y + 'px';
    boardEl.appendChild(f); setTimeout(() => f.remove(), 950);
  }
  function banner(text) {
    const b = document.createElement('div');
    b.className = 'combo-banner'; b.textContent = text;
    boardEl.appendChild(b); setTimeout(() => b.remove(), 950);
  }
  function cheer(src, small) {
    const img = document.createElement('img');
    img.className = 'cheer' + (small ? ' small' : ''); img.src = src; img.alt = '';
    boardEl.appendChild(img); setTimeout(() => img.remove(), 1050);
  }

  /* ---------- 消除 ---------- */
  async function clearCells(initial, creates, combo) {
    // creates: Map(key -> {special, type})，這些格子不會被消掉，而是變成特殊方塊
    const toClear = new Set(), iceHits = new Set();
    for (const k of initial) {
      const r = Math.floor(k / N), c = k % N;
      if (ice[r][c]) iceHits.add(k); else if (grid[r][c]) toClear.add(k);
    }
    const queue = [...toClear];
    const triggered = new Set();
    let usedSpecial = false;
    while (queue.length) {
      const k = queue.pop();
      const r = Math.floor(k / N), c = k % N;
      const t = grid[r][c];
      if (!t || !t.special || triggered.has(k)) continue;
      triggered.add(k); usedSpecial = true;
      const extra = [];
      if (t.special === 'row') { beam(r, c, false); for (let i = 0; i < N; i++) extra.push([r, i]); }
      if (t.special === 'col') { beam(r, c, true); for (let i = 0; i < N; i++) extra.push([i, c]); }
      if (t.special === 'area') for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) extra.push([r + dr, c + dc]);
      if (t.special === 'bomb') {
        const tt = mostCommonType();
        tilesEach((x, i, j) => { if (x.type === tt) extra.push([i, j]); });
      }
      for (const [a, b] of extra) {
        if (!inside(a, b)) continue;
        const kk = key(a, b);
        if (ice[a][b]) { iceHits.add(kk); continue; }
        if (!grid[a][b]) continue;
        if (!toClear.has(kk)) { toClear.add(kk); queue.push(kk); }
        else if (grid[a][b].special && !triggered.has(kk)) queue.push(kk);
      }
    }
    // 消除旁邊的冰塊會被敲一下
    for (const k of toClear) {
      const r = Math.floor(k / N), c = k % N;
      for (const [a, b] of [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]]) if (inside(a, b) && ice[a][b]) iceHits.add(key(a, b));
    }
    if (usedSpecial) sfx.special(); else sfx.pop(combo);
    if (iceHits.size) sfx.ice();
    for (const k of iceHits) hitLayer('ice', Math.floor(k / N), k % N);

    let removed = 0;
    const got = new Set(), stuck = new Set();
    for (const k of toClear) {
      const r = Math.floor(k / N), c = k % N;
      const t = grid[r][c];
      if (!t) continue;
      removed++;
      if (season[r][c]) hitLayer('season', r, c);
      if (mayo[r][c]) {
        // 被美乃滋黏住的角色：這次只清掉一層美乃滋，角色留在原地
        hitLayer('mayo', r, c);
        stuck.add(k);
        continue;
      }
      if (creates.has(k)) {
        const cr = creates.get(k);
        t.type = cr.type; t.special = cr.special;
        refreshTile(t);
        t.el.classList.remove('born'); void t.el.offsetWidth; t.el.classList.add('born');
        continue;
      }
      if (t.type >= 0) { collected[t.type]++; got.add(t.type); }
      burst(r, c, COLORS[t.type] || '#ffe27a');
      t.el.classList.add('pop');
    }
    const gained = removed * 10 * combo + creates.size * 30;
    score += gained;
    const anyK = [...toClear][Math.floor(toClear.size / 2)];
    if (anyK !== undefined) floater(Math.floor(anyK / N), anyK % N, '+' + gained);
    updateHUD(got);
    await sleep(260);
    for (const k of toClear) {
      if (creates.has(k) || stuck.has(k)) continue;
      const r = Math.floor(k / N), c = k % N;
      if (grid[r][c]) { grid[r][c].el.remove(); grid[r][c] = null; }
    }
  }

  function mostCommonType() {
    const cnt = Array(TYPES).fill(0);
    tilesEach(t => { if (t.type >= 0) cnt[t.type]++; });
    return cnt.indexOf(Math.max(...cnt));
  }

  async function gravity() {
    // 冰塊、沒有格子的地方、被黏住的角色都固定不動：方塊往下掉時會穿過它們，補到下面的空格
    for (let c = 0; c < N; c++) {
      const rows = [];
      for (let r = 0; r < N; r++) if (!isFixed(r, c)) rows.push(r);
      let w = rows.length - 1;
      for (let i = rows.length - 1; i >= 0; i--) {
        const r = rows[i];
        if (grid[r][c]) {
          const wr = rows[w];
          if (wr !== r) { grid[wr][c] = grid[r][c]; grid[r][c] = null; }
          w--;
        }
      }
      for (let i = w; i >= 0; i--) grid[rows[i]][c] = makeTile(rand(TYPES), null, rows[i], c, i - (w + 1));
    }
    await new Promise(requestAnimationFrame);
    await new Promise(requestAnimationFrame);
    tilesEach((t, r, c) => { t.el.classList.add('fall'); setPos(t.el, r, c); });
    await sleep(340);
    tilesEach(t => t.el.classList.remove('fall'));
  }

  async function cascade(preferred = []) {
    let combo = 0;
    for (;;) {
      const runs = findRuns();
      if (!runs.length) break;
      combo++;
      const clear = new Set();
      const creates = new Map();
      const hCells = new Map(), vCells = new Map();
      for (const run of runs) for (const [r, c] of run.cells) {
        clear.add(key(r, c));
        (run.dir === 'h' ? hCells : vCells).set(key(r, c), run);
      }
      const pick = run => {
        const free = run.cells.filter(([r, c]) => !mayo[r][c]);
        const pref = preferred.find(([r, c]) => free.some(([a, b]) => a === r && b === c));
        const [r, c] = pref || free[Math.floor(free.length / 2)] || run.cells[0];
        return key(r, c);
      };
      const handled = new Set();
      // 長度 5 以上 → 閃亮鱈花枝
      for (const run of runs) if (run.cells.length >= 5) {
        const k = pick(run); if (!creates.has(k)) creates.set(k, { special: 'bomb', type: -1 }); handled.add(run);
      }
      // L / T 形 → 發光方塊
      for (const [k, hr] of hCells) {
        const vr = vCells.get(k);
        if (!vr || handled.has(hr) || handled.has(vr)) continue;
        if (!creates.has(k)) creates.set(k, { special: 'area', type: hr.type });
        handled.add(hr); handled.add(vr);
      }
      // 長度 4 → 條紋方塊
      for (const run of runs) if (run.cells.length === 4 && !handled.has(run)) {
        const k = pick(run);
        if (!creates.has(k)) creates.set(k, { special: run.dir === 'h' ? 'col' : 'row', type: run.type });
      }

      if (combo >= 2) {
        const line = COMBO_LINES[Math.min(combo, COMBO_LINES.length - 1)];
        banner(`${combo} 連鎖！`);
        if (combo === 3) cheer('assets/horn-laugh.webp');
        if (combo >= 4) cheer(CHEF.laugh);
        say(line || '好棒棒！', combo >= 4 ? 'wow' : 'happy');
      } else if (creates.size) {
        const s = [...creates.values()][0].special;
        say(s === 'bomb' ? `${SPECIAL_NAME}登場！` : s === 'area' ? '發光炸彈！砰砰砰～' : '條紋方塊！一條線掃光光！', 'happy');
      }
      await clearCells(clear, creates, combo);
      await gravity();
      preferred = [];
    }
    return combo;
  }

  async function bombSwap(a, ra, ca, b, rb, cb) {
    sfx.special();
    say(`${SPECIAL_NAME}出動！`, 'wow');
    const clear = new Set([key(ra, ca), key(rb, cb)]);
    if (a.special === 'bomb' && b.special === 'bomb') {
      banner('全場清空！');
      for (const [r, c] of allCells()) clear.add(key(r, c));
    } else {
      const other = a.special === 'bomb' ? b : a;
      const bombPos = a.special === 'bomb' ? [ra, ca] : [rb, cb];
      grid[bombPos[0]][bombPos[1]].special = null; // 已經使用，不再重複觸發
      tilesEach((t, r, c) => {
        if (t.type !== other.type) return;
        clear.add(key(r, c));
        // 如果換的是條紋或發光方塊，同一種的都變成一樣的特殊方塊一起炸
        if (other.special && other.special !== 'bomb' && !t.special && !mayo[r][c]) { t.special = other.special; refreshTile(t); }
      });
      await sleep(200);
    }
    await clearCells(clear, new Map(), 1);
    await gravity();
  }

  /* ---------- 回合 ---------- */
  async function attemptSwap(r1, c1, r2, c2) {
    if (busy || !inside(r2, c2) || !grid[r1][c1] || !grid[r2][c2]) return;
    if (mayo[r1][c1] || mayo[r2][c2]) {
      sfx.bad();
      say('被美乃滋黏住了！把它湊進一排就能清掉', 'angry', 'shake', 1600);
      const t = mayo[r1][c1] || mayo[r2][c2];
      t.el.classList.remove('hit'); void t.el.offsetWidth; t.el.classList.add('hit');
      return;
    }
    busy = true; clearHint(); deselect();
    const a = grid[r1][c1], b = grid[r2][c2];
    swapModel(r1, c1, r2, c2);
    setPos(a.el, r2, c2); setPos(b.el, r1, c1);
    sfx.swap();
    await sleep(190);

    if (a.special === 'bomb' || b.special === 'bomb') {
      moves--; movesUsed++; updateHUD();
      await bombSwap(a, r2, c2, b, r1, c1);
      await cascade();
    } else if (findRuns().length) {
      moves--; movesUsed++; updateHUD();
      await cascade([[r2, c2], [r1, c1]]);
    } else {
      swapModel(r1, c1, r2, c2);
      setPos(a.el, r1, c1); setPos(b.el, r2, c2);
      sfx.bad();
      say('欸…這樣不行啦', 'angry', 'shake', 1400);
      await sleep(190);
      busy = false; scheduleHint();
      return;
    }
    await endTurn();
  }

  async function endTurn() {
    if (goalsMet()) { busy = true; return winLevel(); }
    if (moves <= 0) { busy = true; return loseLevel(); }
    if (!findMove()) await shuffle();
    busy = false;
    scheduleHint();
  }

  async function shuffle(msg = '卡住了？大叔幫你攪一攪～', title = '重新洗牌') {
    say(msg, 'wow');
    banner(title);
    await sleep(500);
    const pos = [], tiles = [];
    tilesEach((t, r, c) => { if (!mayo[r][c]) { pos.push([r, c]); tiles.push(t); } });
    let ok = false;
    for (let tries = 0; tries < 200 && !ok; tries++) {
      for (let i = tiles.length - 1; i > 0; i--) { const j = rand(i + 1); [tiles[i], tiles[j]] = [tiles[j], tiles[i]]; }
      pos.forEach(([r, c], i) => { grid[r][c] = tiles[i]; });
      ok = !findRuns().length && findMove();
    }
    // 真的洗不出可以走的步：把可以移動的角色重新換種類
    while (!ok) {
      tiles.forEach(t => { if (!t.special) t.type = rand(TYPES); });
      ok = !findRuns().length && findMove();
      if (ok) tiles.forEach(refreshTile);
    }
    tilesEach((t, r, c) => setPos(t.el, r, c));
    await sleep(300);
  }

  /* ---------- 關卡目標 ---------- */
  function goalLeft(g) {
    if (g.type === 'score') return Math.max(0, g.n - score);
    if (g.type === 'ice' || g.type === 'mayo' || g.type === 'season') return layerCount(g.type);
    return Math.max(0, g.n - collected[g.tile]);
  }
  const goalsMet = () => L.goals.every(g => goalLeft(g) === 0);
  function goalIcon(g) {
    if (g.type === 'score') return '<b class="gicon">🎯</b>';
    if (g.type === 'ice') return `<img src="${ICE_IMG[3]}" alt="">`;
    if (g.type === 'mayo') return `<img class="gbg" src="${MAYO_IMG[2]}" alt="">`;
    if (g.type === 'season') return `<img class="gbg" src="${SEASON_IMG[2]}" alt="">`;
    return `<img src="${tileImg(g.tile)}" alt="">`;
  }
  function goalText(g) {
    const left = goalLeft(g);
    return left === 0 ? '✔' : left;
  }
  function goalsHTML(initial) {
    return L.goals.map((g, i) => {
      const txt = initial ? (LAYER_CHARS[g.type] ? layoutCount(L, LAYER_CHARS[g.type]) : g.n) : goalText(g);
      const label = g.type === 'score' ? `${txt}${initial ? ' 分' : ''}` : txt;
      return `<div class="goal" data-i="${i}">${goalIcon(g)}<span>${label}</span></div>`;
    }).join('');
  }
  const LAYER_CHARS = { ice: /[1-3]/g, mayo: /[mM]/g, season: /[sS]/g };
  const layoutCount = (lv, re) => ((lv.layout || []).join('').match(re) || []).length;

  /* ---------- 提示 ---------- */
  function clearHint() { clearTimeout(hintTimer); hinted.forEach(t => t.el.classList.remove('hint')); hinted = []; }
  function scheduleHint() {
    clearHint();
    hintTimer = setTimeout(() => {
      if (busy) return;
      const m = findMove(); if (!m) return;
      hinted = m.map(([r, c]) => grid[r][c]);
      hinted.forEach(t => t.el.classList.add('hint'));
      say('提示：試試看這兩個～', 'normal', null, 0);
    }, 6000);
  }

  /* ---------- 道具 ---------- */
  let boosterMode = null, tongsFirst = null;
  function renderBoosters() {
    const box = $('boosters');
    box.innerHTML = Object.entries(BOOSTERS).map(([k, b]) =>
      `<button class="booster${boosterMode === k ? ' active' : ''}" data-k="${k}" title="${b.name}：${b.tip}" ${save.boosters[k] > 0 ? '' : 'disabled'}>` +
      `<img src="${b.img}" alt="${b.name}"><span class="count">${save.boosters[k]}</span></button>`).join('');
    box.querySelectorAll('.booster').forEach(btn => { btn.onclick = () => toggleBooster(btn.dataset.k); });
  }
  function toggleBooster(k) {
    if (busy || save.boosters[k] <= 0) return;
    if (boosterMode === k) { cancelBooster(); say('不用了～', 'normal'); return; }
    cancelBooster();
    deselect(); clearHint();
    if (k === 'fryer') return useFryer();
    boosterMode = k;
    boardEl.classList.add('aiming');
    say(`${BOOSTERS[k].name}：${BOOSTERS[k].tip}`, 'normal', 'bounce', 0);
    renderBoosters();
  }
  function cancelBooster() {
    if (tongsFirst) { const t = grid[tongsFirst[0]][tongsFirst[1]]; if (t) t.el.classList.remove('selected'); }
    boosterMode = null; tongsFirst = null;
    boardEl.classList.remove('aiming');
    renderBoosters();
  }
  function spendBooster(k) { save.boosters[k]--; persist(); }
  function onBoosterTap(r, c) {
    if (!inside(r, c) || voids[r][c]) return;
    if (boosterMode === 'hammer') {
      if (grid[r][c] || ice[r][c]) useHammer(r, c);
      return;
    }
    // 夾子：先夾一個，再點旁邊的一個
    if (!movable(r, c)) {
      if (mayo[r][c]) say('被美乃滋黏住的夾不動喔', 'angry', 'shake', 1400);
      return;
    }
    if (!tongsFirst) { tongsFirst = [r, c]; grid[r][c].el.classList.add('selected'); return; }
    const [r1, c1] = tongsFirst;
    grid[r1][c1].el.classList.remove('selected');
    if (r1 === r && c1 === c) { tongsFirst = null; return; }
    if (Math.abs(r1 - r) + Math.abs(c1 - c) === 1) { useTongs(r1, c1, r, c); return; }
    tongsFirst = [r, c]; grid[r][c].el.classList.add('selected');
  }
  async function useHammer(r, c) {
    spendBooster('hammer'); cancelBooster();
    busy = true; clearHint();
    say('鏘！', 'happy');
    if (ice[r][c]) { sfx.ice(); hitLayer('ice', r, c); updateHUD(); await sleep(280); }
    else await clearCells(new Set([key(r, c)]), new Map(), 1);
    await gravity();
    await cascade();
    await endTurn();
  }
  async function useTongs(r1, c1, r2, c2) {
    spendBooster('tongs'); cancelBooster();
    busy = true; clearHint();
    const a = grid[r1][c1], b = grid[r2][c2];
    swapModel(r1, c1, r2, c2);
    setPos(a.el, r2, c2); setPos(b.el, r1, c1);
    sfx.swap();
    await sleep(190);
    if (a.special === 'bomb' || b.special === 'bomb') { await bombSwap(a, r2, c2, b, r1, c1); await cascade(); }
    else if (findRuns().length) await cascade([[r2, c2], [r1, c1]]);
    await endTurn();
  }
  async function useFryer() {
    spendBooster('fryer'); renderBoosters();
    busy = true; clearHint();
    await shuffle('炸鍋翻一翻～', '炸鍋洗牌！');
    busy = false;
    scheduleHint();
  }

  /* ---------- 輸入 ---------- */
  function select(r, c) { if (!grid[r][c]) return; deselect(); selected = [r, c]; grid[r][c].el.classList.add('selected'); }
  function deselect() { if (selected) { const t = grid[selected[0]][selected[1]]; if (t) t.el.classList.remove('selected'); } selected = null; }

  let down = null;
  function cellFromEvent(e) {
    const rect = boardEl.getBoundingClientRect(), s = rect.width / N;
    return [Math.floor((e.clientY - rect.top) / s), Math.floor((e.clientX - rect.left) / s)];
  }
  boardEl.addEventListener('pointerdown', e => {
    if (busy) return;
    const [r, c] = cellFromEvent(e);
    if (boosterMode) { onBoosterTap(r, c); return; }
    if (!inside(r, c) || !grid[r][c]) return;
    down = { r, c, x: e.clientX, y: e.clientY, moved: false };
    boardEl.setPointerCapture(e.pointerId);
  });
  boardEl.addEventListener('pointermove', e => {
    if (!down || down.moved || busy) return;
    const s = boardEl.getBoundingClientRect().width / N;
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < s * .35) return;
    down.moved = true;
    const [dr, dc] = Math.abs(dx) > Math.abs(dy) ? [0, Math.sign(dx)] : [Math.sign(dy), 0];
    attemptSwap(down.r, down.c, down.r + dr, down.c + dc);
  });
  boardEl.addEventListener('pointerup', () => {
    if (!down) return;
    const { r, c, moved } = down; down = null;
    if (moved || busy) return;
    if (selected) {
      const [sr, sc] = selected;
      if (Math.abs(sr - r) + Math.abs(sc - c) === 1) return attemptSwap(sr, sc, r, c);
      if (sr === r && sc === c) return deselect();
    }
    select(r, c);
  });
  boardEl.addEventListener('pointercancel', () => { down = null; });

  /* ---------- 遊戲中介面 ---------- */
  function starsFor(s) { return s >= L.stars[2] ? 3 : s >= L.stars[1] ? 2 : 1; }
  function updateHUD(bumped = new Set()) {
    document.getElementById('score').textContent = score;
    document.getElementById('moves').textContent = moves;
    const top = L.stars[2];
    document.getElementById('bar').style.width = Math.min(100, score / top * 100) + '%';
    document.querySelectorAll('#progress .pstar').forEach((el, i) => el.classList.toggle('on', score >= L.stars[i]));
    document.querySelectorAll('#goals .goal').forEach(el => {
      const g = L.goals[+el.dataset.i];
      el.querySelector('span').textContent = goalText(g);
      el.classList.toggle('done', goalLeft(g) === 0);
      if (g.type === 'collect' && bumped.has(g.tile)) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
    });
  }

  function showScreen(name) {
    document.getElementById('mapScreen').classList.toggle('hidden', name !== 'map');
    document.getElementById('gameScreen').classList.toggle('hidden', name !== 'game');
    if (name === 'map') renderMap();
  }

  function startLevel(i) {
    syncLives();
    if (save.lives <= 0) return noLives();
    levelIdx = i; L = LEVELS[i];
    score = 0; moves = L.moves; movesUsed = 0; collected = Array(TYPES).fill(0);
    busy = false; selected = null;
    hideDialog(); showScreen('game');
    document.getElementById('levelTitle').textContent = `第 ${i + 1} 關`;
    document.getElementById('goals').innerHTML = goalsHTML(false);
    const prog = document.getElementById('progress');
    prog.querySelectorAll('.pstar').forEach(el => el.remove());
    L.stars.forEach(s => prog.insertAdjacentHTML('beforeend', `<span class="pstar" style="left:${Math.min(97, s / L.stars[2] * 100)}%">⭐</span>`));
    buildBoard(); updateHUD();
    boosterMode = null; tongsFirst = null; boardEl.classList.remove('aiming'); renderBoosters();
    say(i === 0 ? '小朋友，陪大叔消一消吧！' : `第 ${i + 1} 關！加油～`, 'happy');
    scheduleHint();
  }

  function showDialog(html) { document.getElementById('dialog').innerHTML = html; document.getElementById('overlay').classList.add('show'); }
  function hideDialog() { document.getElementById('overlay').classList.remove('show'); }
  const $ = id => document.getElementById(id);

  function levelIntro(i) {
    const lv = LEVELS[i], prevL = L;
    L = lv; const goals = goalsHTML(true); L = prevL;
    syncLives();
    const best = save.stars[i] || 0;
    showDialog(`<h2>第 ${i + 1} 關</h2>
      <div class="stars">${[1, 2, 3].map(s => `<span class="${s <= best ? '' : 'off'}">⭐</span>`).join('')}</div>
      <p>在 <b>${lv.moves}</b> 步內完成目標：</p>
      <div class="dlg-goals">${goals}</div>
      <div class="lives" style="justify-content:center;margin:6px 0 12px">${livesHTML()}</div>
      <div class="row"><button class="btn" id="dlgBack">返回</button><button class="btn primary" id="dlgPlay" ${save.lives ? '' : 'disabled'}>開始 ▶</button></div>`);
    $('dlgBack').onclick = hideDialog;
    $('dlgPlay').onclick = () => startLevel(i);
  }

  function noLives() {
    showDialog(`<img class="mini" src="${CHEF.cry}" alt=""><h2>小魚游光了</h2>
      <p>每 20 分鐘會游回 1 隻小魚<br><b>${lifeTimerText()}</b></p>
      <button class="btn primary" id="dlgOk">好</button>`);
    $('dlgOk').onclick = () => { hideDialog(); showScreen('map'); };
  }

  async function winLevel() {
    clearHint(); sfx.win();
    banner('過關！');
    // 剩下的步數每一步加 60 分
    const bonus = moves * 60; score += bonus; moves = 0; updateHUD();
    await sleep(700);
    const stars = starsFor(score);
    save.stars[levelIdx] = Math.max(save.stars[levelIdx] || 0, stars);
    let gift = '';
    if (stars === 3) {
      const k = Object.keys(BOOSTERS)[rand(3)];
      save.boosters[k]++;
      gift = `<p><span class="booster-gift"><img src="${BOOSTERS[k].img}" alt="">三星獎勵：${BOOSTERS[k].name} +1</span></p>`;
    }
    persist();
    say('太厲害了！大叔請你吃魚丸！', 'happy', 'bounce', 0);
    const starHTML = [1, 2, 3].map(i => `<span class="${i <= stars ? '' : 'off'}">⭐</span>`).join('');
    const hasNext = levelIdx + 1 < LEVELS.length;
    showDialog(`<img class="mini" src="${CHEF.happy}" alt=""><h2>過關啦！</h2><div class="stars">${starHTML}</div>
      <p>分數 <b>${score}</b>${bonus ? `（剩餘步數獎勵 +${bonus}）` : ''}</p>${gift}
      <div class="row"><button class="btn" id="dlgMap">🗺️ 地圖</button>
      ${hasNext ? '<button class="btn primary" id="dlgNext">下一關 ▶</button>' : ''}</div>
      ${hasNext ? '' : '<p>目前的關卡都破完了！新關卡製作中～</p>'}`);
    $('dlgMap').onclick = () => { hideDialog(); showScreen('map'); };
    if (hasNext) $('dlgNext').onclick = () => levelIntro(levelIdx + 1);
  }

  function loseLevel() {
    clearHint(); sfx.lose();
    loseLife();
    say('嗚嗚…差一點點', 'sad', 'shake', 0);
    const left = L.goals.filter(g => goalLeft(g) > 0).map(g =>
      `<div class="goal">${goalIcon(g)}<span>${g.type === 'score' ? '差 ' + goalLeft(g) : '剩 ' + goalLeft(g)}</span></div>`).join('');
    showDialog(`<img class="mini" src="${CHEF.cry}" alt=""><h2>步數用完了</h2>
      <p>還差一點點就過關了！</p><div class="dlg-goals">${left}</div>
      <div class="lives" style="justify-content:center;margin:6px 0 12px">${livesHTML()}</div>
      <div class="row"><button class="btn" id="dlgMap">🗺️ 地圖</button><button class="btn primary" id="dlgRetry" ${save.lives ? '' : 'disabled'}>再挑戰 ▶</button></div>`);
    $('dlgMap').onclick = () => { hideDialog(); showScreen('map'); };
    $('dlgRetry').onclick = () => startLevel(levelIdx);
  }

  function confirmQuit() {
    if (busy) return;
    if (!movesUsed) { clearHint(); showScreen('map'); return; }
    showDialog(`<img class="mini" src="${CHEF.angry}" alt=""><h2>要離開嗎？</h2>
      <p>現在離開會<b>失去 1 隻小魚</b>喔！</p>
      <div class="row"><button class="btn" id="dlgStay">繼續玩</button><button class="btn primary" id="dlgQuit">離開</button></div>`);
    $('dlgStay').onclick = hideDialog;
    $('dlgQuit').onclick = () => { loseLife(); clearHint(); hideDialog(); showScreen('map'); };
  }

  function helpHTML() {
    const cast = TILES.map(c => `<figure><img src="${c.img}" alt="">${c.name}</figure>`).join('');
    return `<div class="cast">${cast}</div><h2>鱈魚大叔消消樂</h2>
      <div class="howto">
        <div>👆 滑動或點選兩個相鄰的角色交換位置</div>
        <div>✨ 三個以上同樣的排成一線就會消除</div>
        <div>🎯 在步數用完前完成關卡目標就過關</div>
        <div><img src="${ICE_IMG[3]}" alt=""> 冰塊：在旁邊消除就能敲裂，要敲 1～3 下</div>
        <div><img src="${MAYO_IMG[2]}" alt=""> 美乃滋：角色被黏住不能移動，把它湊進一排就能清掉一層</div>
        <div><img src="${SEASON_IMG[2]}" alt=""> 調味料：撒在格子上（角色能移動），在那一格消除就會變少、消失</div>
        <div>➖ 連成 4 個 → <b>條紋方塊</b>，直線清除一整排</div>
        <div>💥 排成 L 或 T 形 → <b>發光方塊</b>，炸開周圍 3×3</div>
        <div><img src="${SPECIAL_IMG}" alt=""> 連成 5 個 → <b>${SPECIAL_NAME}</b>！和任何方塊交換，同一種全部消光</div>
        <div>${Object.values(BOOSTERS).map(b => `<img src="${b.img}" alt="">`).join('')} 道具（不算步數）：${Object.values(BOOSTERS).map(b => `<b>${b.name}</b> ${b.tip}`).join('；')}</div>
        <div><svg viewBox="0 0 60 40" width="26" height="18" style="vertical-align:middle"><use href="#fish"/></svg> 沒過關會失去 1 隻小魚，每 20 分鐘游回 1 隻</div>
      </div>
      <button class="btn primary" id="go">知道了</button>`;
  }
  function showHelp() { showDialog(helpHTML()); $('go').onclick = hideDialog; }

  /* ---------- 地圖 ---------- */
  const STEP = 120;
  function renderMap() {
    syncLives();
    $('mapLives').innerHTML = livesHTML();
    $('lifeTimer').textContent = lifeTimerText();
    const path = $('mapPath'), n = LEVELS.length;
    const height = n * STEP + 160;
    path.style.height = height + 'px';
    const pts = LEVELS.map((_, i) => [50 + Math.sin(i * 1.1) * 28, height - 90 - i * STEP]);
    const current = LEVELS.findIndex((_, i) => !(save.stars[i] > 0));
    let html = `<svg class="road" viewBox="0 0 100 ${height}" preserveAspectRatio="none">
      <polyline points="${pts.map(([x, y]) => `${x},${y}`).join(' ')}" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      <polyline points="${pts.map(([x, y]) => `${x},${y}`).join(' ')}" fill="none" stroke="#ffd3e2" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
    // 裝飾：沿路放幾隻夥伴
    const deco = [TILES[1].img, TILES[2].img, TILES[3].img, TILES[4].img, TILES[5].img];
    for (let i = 1; i < n; i += 2) {
      const side = Math.sin(i * 1.1) > 0 ? 8 : 74;
      html += `<img class="map-deco" src="${deco[i % deco.length]}" alt="" style="left:${side}%;top:${height - 150 - i * STEP}px;width:56px;opacity:.55">`;
    }
    pts.forEach(([x, y], i) => {
      const st = save.stars[i] || 0;
      const unlocked = i === 0 || (save.stars[i - 1] || 0) > 0;
      const cls = !unlocked ? 'locked' : st ? 'done' : 'current';
      const starRow = unlocked ? `<span class="nstars">${[1, 2, 3].map(s => `<span class="${s <= st ? '' : 'off'}">⭐</span>`).join('')}</span>` : '';
      html += `<button class="node ${cls}" data-i="${i}" style="left:${x}%;top:${y}px">${unlocked ? i + 1 : '🔒'}${starRow}</button>`;
    });
    const at = current === -1 ? n - 1 : current;
    html += `<img class="marker" src="${CHEF.happy}" alt="" style="left:${pts[at][0]}%;top:${pts[at][1] - 100}px">`;
    path.innerHTML = html;
    path.querySelectorAll('.node:not(.locked)').forEach(b => { b.onclick = () => levelIntro(+b.dataset.i); });
    const scroll = $('mapScroll');
    requestAnimationFrame(() => { scroll.scrollTop = pts[at][1] - scroll.clientHeight / 2; });
  }
  setInterval(() => {
    if ($('mapScreen').classList.contains('hidden')) return;
    const before = save.lives; syncLives();
    if (save.lives !== before) $('mapLives').innerHTML = livesHTML();
    $('lifeTimer').textContent = lifeTimerText();
  }, 1000);

  $('btnHelp').onclick = showHelp;
  $('btnMap').onclick = confirmQuit;
  $('btnSound').onclick = e => { soundOn = !soundOn; e.target.textContent = soundOn ? '🔊 音效' : '🔇 靜音'; };

  // 背景泡泡
  for (let i = 0; i < 14; i++) {
    const b = document.createElement('div');
    const s = 8 + Math.random() * 26;
    b.className = 'bg-bubble';
    Object.assign(b.style, { width: s + 'px', height: s + 'px', left: Math.random() * 100 + 'vw',
      animationDuration: 8 + Math.random() * 10 + 's', animationDelay: -Math.random() * 15 + 's' });
    document.body.appendChild(b);
  }

  showScreen('map');
  if (!save.stars.length) showHelp();
})();
</script>
</body>
</html>
